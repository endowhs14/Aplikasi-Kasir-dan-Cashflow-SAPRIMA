name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.12.1+1'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Android dependencies
        run: sdkmanager 'platforms;android-35' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Locked dependencies and validation
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
          flutter test --reporter expanded
          python3 tool/check_crash.py
      - name: Build debug APK
        working-directory: apps/mobile
        run: flutter build apk --debug
      - name: Verify and package
        run: |
          mkdir -p artifacts
          cp apps/mobile/build/app/outputs/flutter-apk/app-debug.apk artifacts/saprima-kasir-0.1.0-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/saprima-kasir-0.1.0-debug.apk
          python3 - <<'PY'
          import pathlib,hashlib,json,os
          p=pathlib.Path('artifacts/saprima-kasir-0.1.0-debug.apk')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          p.with_name('SHA256SUMS').write_text(sha+'  '+p.name+'\n')
          p.with_name('apk-metadata.json').write_text(json.dumps({'filename':p.name,'sha256':sha,'bytes':p.stat().st_size,'applicationId':'id.saprima.saprima_kasir','versionName':'0.1.0','versionCode':1,'minSdk':24,'targetSdk':36,'build':'debug','sourceCommit':os.environ['GITHUB_SHA'],'abis':['armeabi-v7a','arm64-v8a','x86_64']},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saprima-android-debug
          path: artifacts/*
          retention-days: 30
      - name: Attach files to the prepared prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0-alpha.1 artifacts/* --clobber
