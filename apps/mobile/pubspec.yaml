name: saprima_kasir
description: Kasir lokal SAPRIMA untuk uji Android awal.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqlite3: 3.7.1
  flutter_secure_storage: 11.2.0
  path_provider: 2.1.6
  uuid: 4.6.0
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
